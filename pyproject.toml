[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-cascade-response"
version = "0.1.0"
description = "Post-disaster decision support for the Micro1 flood and debris-flow MVP."
readme = "docs/product.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
]

[project.scripts]
climate-cascade-baseline = "climate_cascade.cli:main"
climate-cascade-evaluate-baseline = "climate_cascade.cli:evaluate_main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
