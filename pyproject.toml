[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-cascade-response"
version = "0.1.0"
description = "Post-disaster decision support for the Micro1 flood and debris-flow MVP."
readme = "docs/product.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.39,<1",
]

[project.scripts]
climate-cascade-baseline = "climate_cascade.cli:main"
climate-cascade-evaluate-baseline = "climate_cascade.cli:evaluate_main"
climate-cascade-evaluate-agent = "climate_cascade.cli:evaluate_agent_main"
climate-cascade-api = "climate_cascade.api.server:main"
climate-cascade-worker = "climate_cascade.workflow.worker:main"
climate-cascade-local = "climate_cascade.local:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
